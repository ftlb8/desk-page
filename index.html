<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <!-- Raise this number, here and on the five files below, with every change, so browsers fetch the new files. -->
  <meta name="desk-version" content="11">
  <!-- The page may only load its own files and talk to the Desk's Supabase project. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://sqkstllfyaqrkillnplq.supabase.co wss://sqkstllfyaqrkillnplq.supabase.co; base-uri 'none'; form-action 'none'">
  <title>Desk</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <main id="signin" class="signin" hidden>
    <h1>Desk</h1>
    <form id="signin-form" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" class="primary">Sign in</button>
      <p id="signin-error" class="error" role="alert" hidden></p>
    </form>
  </main>

  <div id="app" hidden>
    <header class="bar">
      <h1>Desk</h1>
      <nav id="filters" class="filters" aria-label="Organisation"></nav>
      <div class="bar-right">
        <span id="live" class="live" title="Connection to the Desk">Connecting</span>
        <button id="alerts" type="button" class="quiet" hidden>Turn on alerts</button>
        <button id="signout" type="button" class="quiet">Sign out</button>
      </div>
    </header>

    <nav id="views" class="views" aria-label="Section"></nav>

    <p id="notice" class="notice" role="status" hidden></p>

    <main>
      <section aria-labelledby="h-waiting" data-view="inbox">
        <h2 id="h-waiting">Waiting on you <span id="n-waiting" class="count"></span></h2>
        <div id="list-waiting" class="list"></div>
      </section>

      <section aria-labelledby="h-commit" data-view="commitments">
        <h2 id="h-commit">Commitments <span id="n-commit" class="count"></span></h2>
        <div id="list-commit" class="list"></div>
      </section>

      <section aria-labelledby="h-tasks" data-view="tasks">
        <h2 id="h-tasks">Tasks <span id="n-tasks" class="count"></span></h2>
        <form id="task-form" class="task-form" autocomplete="off">
          <input id="task-title" type="text" placeholder="Add a task in your own words, e.g. “payroll run every other Friday”" maxlength="500" required aria-label="New task">
          <button id="task-add" type="submit" class="btn">Add</button>
        </form>
        <div id="task-tools" class="task-tools"></div>
        <div id="list-tasks"></div>
        <details id="box-tasks-done">
          <summary>Done in the last 24 hours <span id="n-tasks-done" class="count"></span></summary>
          <div id="list-tasks-done"></div>
        </details>
      </section>

      <section aria-labelledby="h-look" data-view="inbox">
        <h2 id="h-look">Worth a look <span id="n-look" class="count"></span></h2>
        <div id="list-look" class="list"></div>
      </section>

      <details id="box-later">
        <summary>Later <span id="n-later" class="count"></span></summary>
        <div id="list-later" class="list"></div>
      </details>

      <details id="box-closed">
        <summary>Closed in the last 24 hours <span id="n-closed" class="count"></span></summary>
        <div id="list-closed" class="list"></div>
      </details>
    </main>

    <footer id="updated" class="updated"></footer>

    <dialog id="task-dialog" class="task-dialog" aria-labelledby="td-heading">
      <form id="td-form" method="dialog" autocomplete="off">
        <h2 id="td-heading">Task</h2>
        <p id="td-hint" class="hint" hidden></p>
        <label for="td-title">Task</label>
        <input id="td-title" type="text" maxlength="300" required>
        <div class="td-row">
          <div><label for="td-space">Organisation</label>
            <select id="td-space"><option value="metaculus">Metaculus</option><option value="cea">CEA</option><option value="personal">Personal</option></select></div>
          <div><label for="td-project">Project</label>
            <select id="td-project"></select>
            <input id="td-project-new" type="text" maxlength="80" placeholder="New project name" aria-label="New project name" hidden></div>
        </div>
        <div class="td-row">
          <div><label for="td-horizon">When</label>
            <select id="td-horizon"><option value="today">Today</option><option value="week">This week</option><option value="later">Later</option></select></div>
          <div><label for="td-due">Due date</label>
            <input id="td-due" type="date"></div>
          <div><label for="td-repeat">Repeats</label>
            <select id="td-repeat"><option value="">Does not repeat</option><option value="daily">Every day</option><option value="weekly">Every week</option><option value="biweekly">Every 2 weeks</option><option value="monthly">Every month</option></select></div>
        </div>
        <label for="td-context">Background</label>
        <textarea id="td-context" rows="4" maxlength="4000"></textarea>
        <label>Steps</label>
        <div id="td-steps" class="td-steps"></div>
        <div class="td-row td-addlink">
          <input id="td-step-text" type="text" maxlength="200" placeholder="Add a step" aria-label="New step">
          <button id="td-step-add" type="button" class="btn">Add step</button>
        </div>
        <div id="td-related-box" hidden>
          <label>Related open work</label>
          <div id="td-related" class="td-related"></div>
        </div>
        <label for="td-notes">Notes</label>
        <textarea id="td-notes" rows="4" maxlength="20000"></textarea>
        <label>Links</label>
        <div id="td-links" class="td-links"></div>
        <div class="td-row td-addlink">
          <input id="td-link-label" type="text" maxlength="80" placeholder="Name" aria-label="Link name">
          <input id="td-link-url" type="url" maxlength="2000" placeholder="https://…" aria-label="Link address">
          <button id="td-link-add" type="button" class="btn">Add link</button>
        </div>
        <p id="td-source" class="hint" hidden></p>
        <p id="td-error" class="error" role="alert" hidden></p>
        <div class="td-actions">
          <button id="td-save" type="submit" class="primary">Save</button>
          <button id="td-done" type="button" class="btn">Mark done</button>
          <button id="td-drop" type="button" class="btn subtle">Drop</button>
          <button id="td-cancel" type="button" class="btn subtle">Cancel</button>
        </div>
      </form>
    </dialog>
  </div>

  <script src="vendor/supabase-2.119.0.js?v=11"></script>
  <script src="config.js?v=11"></script>
  <script src="format.js?v=11"></script>
  <script src="app.js?v=11"></script>
</body>
</html>
